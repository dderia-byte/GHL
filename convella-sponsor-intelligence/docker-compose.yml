services:
  postgres:
    image: postgres:16-alpine
    container_name: convella-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: convella
      POSTGRES_PASSWORD: convella
      POSTGRES_DB: convella_sponsor_intelligence
    ports:
      - "5432:5432"
    volumes:
      - convella_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U convella -d convella_sponsor_intelligence"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  convella_postgres_data:
